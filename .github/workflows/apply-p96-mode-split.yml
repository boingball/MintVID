name: Apply P96 startup-mode split (temporary)
on:
  push:
    branches:
      - codex/p96-startup-mode-split
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger P96 source changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply source changes and validate
        run: |
          set -euo pipefail
          python3 player/tests/apply_p96_gui_split.py
          git diff --check
          gcc -std=c99 -Wall -Wextra -c player/core/mr_play_options.c -o /tmp/mr_play_options.o
      - name: Commit split to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player/core/mr_play_options.h player/core/mr_play_options.c player/amiga/mrgui.c player/amiga/mrgui_gadtools.c player/tests/mr_iptv_check.c
          git commit -m 'Split P96 windowed and fullscreen startup modes'
          git push origin HEAD:codex/p96-startup-mode-split
