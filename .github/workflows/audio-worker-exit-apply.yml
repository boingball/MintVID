name: Apply audio worker shutdown patch
on:
  push:
    branches:
      - fix/audio-worker-exit-ack
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Fix Paula worker exit handshake and log ESC teardown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply anchored patch and validate syntax/ownership invariants
        run: |
          python3 scripts/apply_audio_exit_fix.py
          git diff --check
          grep -q 'Forbid();' player/amiga/audio_paula.c
          grep -q 'shutdown: %s' player/amiga/mrplay.c
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player/amiga/audio_paula.c player/amiga/mrplay.c
          git commit -m 'Fix Paula worker exit handshake and log ESC teardown'
          git push
