name: Apply P96 MemoryWindow live-resize fix
on:
  push:
    branches:
      - fix/p96-memory-live-resize
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply anchored patch and validate source invariants
        run: |
          set -euo pipefail
          if grep -q 'p96pip-resize: live MemoryWindow' player/amiga/display_p96pip.c; then
            echo 'Live-resize patch already applied'
            exit 0
          fi
          python3 scripts/apply_p96_live_resize.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path('player/amiga/display_p96pip.c').read_text()
          poll = s.split('static int p96pip_poll(void *h)\n{', 1)[1].split('static int p96pip_toggle_fullscreen(void *h)\n{', 1)[0]
          geom = s.split('static void calculate_geometry(p96pip_state *s)\n{', 1)[1].split('static const char *pip_err_name', 1)[0]
          assert 'sync_content_geometry(s);' in poll
          assert 'reopen_pip(s,' not in poll
          assert 'if (!s->fullscreen || s->force_full_dest)' in geom
          assert 'simple_window ? TAG_IGNORE : P96PIP_Relativity' in s
          print('Resize invariants passed: live PIP, full-window geometry, no drag-time reopen')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player/amiga/display_p96pip.c
          git commit -m 'Let P96 scale MemoryWindow during live resize'
          git push origin HEAD:fix/p96-memory-live-resize
