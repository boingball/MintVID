name: Apply P96 overlay test patch

on:
  push:
    branches:
      - fix/p96-memory-rgb565-overlay

permissions:
  contents: write

jobs:
  apply-test-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply anchored P96 overlay patch
        run: |
          if grep -q 'RGBFB_Y4U2V2, RGBFB_R5G6B5PC, RGBFB_R5G6B5' player/amiga/display_p96pip.c; then
            echo 'Patch already integrated; nothing to do.'
            exit 0
          fi
          python3 scripts/patch_p96_overlay.py --check
          python3 scripts/patch_p96_overlay.py
          cc -std=c99 -Wall -Wextra -Werror -Iplayer/amiga player/tests/test_p96_rgb565.c -o /tmp/test-p96-rgb565
          /tmp/test-p96-rgb565
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player/amiga/display_p96pip.c
          git commit -m 'Negotiate YUV422 and RGB565 P96 memory overlays'
          git push origin HEAD:fix/p96-memory-rgb565-overlay
