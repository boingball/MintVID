name: Build

# Compile MintVID for AmigaOS (m68k) on every push and pull request.
# MintVID uses submodules for MintAMP and libavc, so checkout must recurse.
# The all-in-one Amiga image includes the AmiSSL SDK used by the HTTPS build.
#
# The `build` job only proves the AmigaOS cross-compile links: it does not
# run any decoder. `conformance` is what actually exercises the portable
# core - `make check`/`check-audio` decode real fixtures and diff against
# ffmpeg on the host (x86-64), and `make check-m68k` cross-builds the same
# suite for m68k-linux-gnu and runs it under qemu-m68k for real big-endian,
# relaxed-alignment execution (see player/tests/run_m68k_check.sh and
# CLAUDE.md) - a hand-asm bug that only misbehaves on real m68k codegen
# cannot be caught by `build` compiling cleanly.
#
# `nightly` builds all three Amiga CPU profiles and updates one rolling
# GitHub pre-release. It runs after conformance on pushes to main and once
# per night. Normal numbered releases remain separate.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: "Build and publish the rolling Nightly release (main only)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 2 * * *"
      timezone: "Europe/London"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ffmpeg (conformance oracle) and the m68k cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg gcc-m68k-linux-gnu binutils-m68k-linux-gnu qemu-user

      - name: Check the 68060 AAC partial-product arithmetic
        working-directory: player/vendor/MintAMP
        run: make -f Makefile.amiga aac-mulshift60-ref-test

      - name: make check (host, video codecs vs ffmpeg)
        working-directory: player
        run: make check

      - name: make check-audio (host, MP3/AAC/LATM/AC-3 vs ffmpeg)
        working-directory: player
        run: make check-audio

      - name: make check-m68k (real m68k/big-endian codegen under qemu)
        working-directory: player
        run: sh tests/run_m68k_check.sh

  build:
    # The scheduled run is for the three-profile Nightly build below, so avoid
    # doing a duplicate single-profile Amiga build first.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile with the Amiga cross-compiler
        run: |
          docker run --rm -v "$PWD":/src -w /src/player \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_ROOT="$(dirname "$(dirname "$AMIGA_GCC")")"
              echo "Compiler: $AMIGA_GCC"
              "$AMIGA_GCC" --version | head -1
              make -f Makefile.amiga all \
                AMIGA_ROOT="$AMIGA_ROOT" \
                SSL=1 SSLCERTS=1
            '

      - name: Confirm the programs were produced
        run: |
          ls -la player/mrplay player/MintVID player/iptvgui player/ytgui \
            player/MintVID-GT player/iptvgui-GT player/ytgui-GT player/mr_decode
          file player/mrplay player/MintVID player/iptvgui player/ytgui \
            player/MintVID-GT player/iptvgui-GT player/ytgui-GT player/mr_decode || true

      # DIAGNOSTIC BRANCH step: real m68k-amigaos-objdump disassembly of the
      # linked mrplay, plus its linker map (player/mrplay.map, produced by
      # the -Wl,-Map= flag added to this branch's Makefile.amiga) - both
      # uploaded as artifacts for the controlled-regression investigation in
      # CLAUDE.md's "mrplay crashes on Play" section. This is current main
      # otherwise unchanged - the known-crashing build.
      - name: Disassemble mrplay with the real Amiga toolchain
        run: |
          docker run --rm -v "$PWD":/src -w /src/player \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_ROOT="$(dirname "$(dirname "$AMIGA_GCC")")"
              OBJDUMP="$(command -v m68k-amigaos-objdump || true)"
              if [ -z "$OBJDUMP" ]; then
                OBJDUMP="$AMIGA_ROOT/bin/m68k-amigaos-objdump"
              fi
              echo "Objdump: $OBJDUMP"
              "$OBJDUMP" -d -r mrplay > mrplay.disasm.txt
              "$OBJDUMP" -h mrplay > mrplay.sections.txt
              wc -l mrplay.disasm.txt mrplay.map 2>/dev/null || true
            '

      - name: Upload diagnostic linker map and disassembly
        uses: actions/upload-artifact@v4
        with:
          name: MintVID-AmigaOS-diagnostics
          path: |
            player/mrplay.map
            player/mrplay.disasm.txt
            player/mrplay.sections.txt
          if-no-files-found: warn

      - name: Upload compiled programs
        uses: actions/upload-artifact@v4
        with:
          name: MintVID-AmigaOS
          path: |
            player/mrplay
            player/MintVID
            player/iptvgui
            player/ytgui
            player/MintVID-GT
            player/iptvgui-GT
            player/ytgui-GT
            player/mr_decode
          if-no-files-found: error
          retention-days: 14

  nightly:
    # Scheduled workflows run from main. Automatic publishing is also limited
    # to main so the public Nightly never points at an arbitrary feature branch.
    needs: conformance
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.publish_nightly == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: mintvid-nightly-release
      cancel-in-progress: true

    steps:
      - name: Check out the code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build 68030, 68040 and 68060 release sets
        run: |
          docker run --rm -v "$PWD":/src -w /src/player \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_ROOT="$(dirname "$(dirname "$AMIGA_GCC")")"
              echo "Compiler: $AMIGA_GCC"
              "$AMIGA_GCC" --version | head -1
              make -f Makefile.amiga release \
                AMIGA_ROOT="$AMIGA_ROOT" \
                SSL=1 SSLCERTS=1
            '
      
      - name: Fix release directory permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" player/release

      - name: Confirm the release sets and licence notices were produced
        shell: bash
        run: |
          set -euo pipefail
          for cpu in 030 040 060; do
            dir="player/release/MintVID${cpu}"
            echo "Checking $dir"
            test -d "$dir"
            for program in \
              mrplay MintVID iptvgui ytgui \
              MintVID-GT iptvgui-GT ytgui-GT mr_decode
            do
              test -f "$dir/$program"
            done
          done

          license_dir="player/release/LICENSES"
          echo "Checking $license_dir"
          test -d "$license_dir"
          for notice in \
            MintVID-LICENSE.txt \
            THIRD-PARTY-LICENSES.txt \
            GPL-2.0.txt \
            libavc-LICENSE.txt \
            libavc-NOTICE.txt \
            MintAMP-LICENSE.txt \
            RPSL.txt \
            RCSL.txt
          do
            test -f "$license_dir/$notice"
          done

          find player/release -maxdepth 2 -type f -print | sort

      - name: Create Nightly package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          cat > player/release/NIGHTLY.txt <<EOF
          MintVID Nightly Build
          =====================

          Built:  ${BUILD_DATE}
          Commit: ${GITHUB_SHA}
          Ref:    ${GITHUB_REF_NAME}
          Run:    ${GITHUB_RUN_NUMBER}

          This is an automated development build and may contain experimental
          changes. For normal use, prefer a numbered stable MintVID release.

          Included CPU builds:
            MintVID030 - Motorola 68030+
            MintVID040 - Motorola 68040+
            MintVID060 - Motorola 68060

          The LICENSES drawer contains MintVID and third-party licence notices.
          EOF

          cp MintVID.readme player/release/MintVID.readme
          cp README.md player/release/README.md

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          source = Path("player/release")
          target = Path("dist/MintVID-Nightly.zip")

          with zipfile.ZipFile(
              target, "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9
          ) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(source))

          print(f"Created {target} ({target.stat().st_size} bytes)")
          PY

          (cd dist && sha256sum MintVID-Nightly.zip > MintVID-Nightly.zip.sha256)

          cat > dist/nightly-notes.md <<EOF
          Automated MintVID development build.

          **Built:** ${BUILD_DATE}
          **Ref:** \`${GITHUB_REF_NAME}\`
          **Commit:** \`${GITHUB_SHA}\`
          **Actions run:** #${GITHUB_RUN_NUMBER}

          The ZIP contains ready-to-run **68030**, **68040** and **68060**
          directories, the plain-text and Markdown README files, and the
          **LICENSES** drawer with MintVID and third-party licence notices.

          This is a **pre-release/nightly** build. Numbered releases remain the
          recommended stable downloads.
          EOF

          ls -lh dist/MintVID-Nightly.zip dist/MintVID-Nightly.zip.sha256

      - name: Upload Nightly as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintVID-Nightly-${{ github.sha }}
          path: |
            dist/MintVID-Nightly.zip
            dist/MintVID-Nightly.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep one permanent rolling tag/release rather than creating a new
          # GitHub Release every day.
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "MintVID Nightly" \
              --notes-file dist/nightly-notes.md \
              --prerelease

            gh release upload nightly \
              dist/MintVID-Nightly.zip \
              dist/MintVID-Nightly.zip.sha256 \
              --clobber
          else
            gh release create nightly \
              dist/MintVID-Nightly.zip \
              dist/MintVID-Nightly.zip.sha256 \
              --verify-tag \
              --title "MintVID Nightly" \
              --notes-file dist/nightly-notes.md \
              --prerelease \
              --latest=false
          fi
