name: Fused AGA 68060

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-mpeg-pts-followup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Suppress duplicate/non-advancing MPEG display tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('player/core/mr_mpeg2.c')
          s = p.read_text()
          changed = False

          old = '''    mpeg2_frame_node  *free_nodes;\n    int                flushing;\n    int                flush_done;\n} mpeg2_state;'''
          new = '''    mpeg2_frame_node  *free_nodes;\n    int                flushing;\n    int                flush_done;\n    int                have_last_output_pts;\n    uint64_t           last_output_pts;\n} mpeg2_state;'''
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit('mpeg2_state insertion point missing')
              s = s.replace(old, new)
              changed = True

          old = '''/* Return the timestamp attached to the picture currently exposed in dec->frame. */\nint mr_mpeg2_output_pts(mr_decoder *dec, uint64_t *pts_us)\n{\n    mpeg2_state *s;\n    if (!dec || dec->codec != &mr_codec_mpeg2 || !pts_us) return 0;\n    s = (mpeg2_state *)dec->priv;\n    if (!s || !s->current || !s->current->has_pts) return 0;\n    *pts_us = s->current->pts_us;\n    return 1;\n}\n'''
          new = '''/* Return a usable anchor timestamp for the picture currently exposed in\n * dec->frame. MPEG PES packets can contain more than one picture, so\n * libmpeg2 may legitimately propagate the same packet tag onto consecutive\n * displayed pictures. Such a duplicate is NOT a second frame timestamp.\n * Suppress duplicate/backward tags and let mrplay's existing display-order\n * synthetic clock advance that picture by one frame period instead. The next\n * genuinely newer tag remains an authoritative container anchor. */\nint mr_mpeg2_output_pts(mr_decoder *dec, uint64_t *pts_us)\n{\n    mpeg2_state *s;\n    uint64_t cur;\n    if (!dec || dec->codec != &mr_codec_mpeg2 || !pts_us) return 0;\n    s = (mpeg2_state *)dec->priv;\n    if (!s || !s->current || !s->current->has_pts) return 0;\n    cur = s->current->pts_us;\n    if (s->have_last_output_pts && cur <= s->last_output_pts) return 0;\n    s->last_output_pts = cur;\n    s->have_last_output_pts = 1;\n    *pts_us = cur;\n    return 1;\n}\n'''
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit('mr_mpeg2_output_pts replacement point missing')
              s = s.replace(old, new)
              changed = True

          p.write_text(s)
          if not changed:
              Path('/tmp/nochanges').write_text('already applied')
          PY

      - name: Validate and push
        run: |
          if [ -f /tmp/nochanges ]; then
            echo "follow-up already applied"
            exit 0
          fi
          git diff --check
          git diff -- player/core/mr_mpeg2.c
          git config user.name "Darren Banfi"
          git config user.email "33876110+boingball@users.noreply.github.com"
          git add player/core/mr_mpeg2.c
          git commit -m "Treat duplicate MPEG PES tags as synthetic frame timing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  fused-68060:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install m68k/QEMU correctness toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-m68k-linux-gnu qemu-user

      - name: Bit-exact fused planar check on m68k
        working-directory: player
        run: |
          set -e
          m68k-linux-gnu-gcc -O2 -std=c99 -m68030 -static \
            -DMR_M68K_ASM=1 \
            -o /tmp/mr_yuv_planar_queue_check.m68k \
            tests/mr_yuv_planar_queue_check.c \
            core/mr_yuv_planar_queue.c \
            core/mr_yuv_dither.c core/mr_yuv_dither_planar_m68k.S \
            core/mr_yuv_dither_planar_direct_m68k.S \
            core/mr_c2p.c core/mr_c2p_m68k.S \
            core/mr_c2p_riva_native_m68k.S
          qemu-m68k /tmp/mr_yuv_planar_queue_check.m68k

      - name: Build experimental 68060 mrplay
        run: |
          docker run --rm -v "$PWD":/src -w /src/player \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_ROOT="$(dirname "$(dirname "$AMIGA_GCC")")"
              "$AMIGA_GCC" --version | head -1
              make -f Makefile.fused mrplay-fused \
                CPU=68060 \
                AMIGA_ROOT="$AMIGA_ROOT" \
                SSL=1 SSLCERTS=1
            '

      - name: Confirm fused player
        run: |
          ls -la player/mrplay
          file player/mrplay || true

      - name: Upload fused 68060 player
        uses: actions/upload-artifact@v4
        with:
          name: MintVID-Fused-68060
          path: player/mrplay
          if-no-files-found: error
          retention-days: 14
