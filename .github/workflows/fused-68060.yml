name: Fused AGA 68060

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-mpeg-pts-fix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply libmpeg2 display-PTS plumbing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n == 0 and new in s:
                  return False
              if n != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {n}: {old[:80]!r}")
              p.write_text(s.replace(old, new))
              return True

          changed = False

          changed |= rep(
              "player/core/mr_mpeg2.c",
              "typedef struct mpeg2_frame_node {\n"
              "    uint8_t *rgb;                /* RGB24, or packed YUV420P under yuv_output */\n"
              "    struct mpeg2_frame_node *next;\n"
              "} mpeg2_frame_node;",
              "typedef struct mpeg2_frame_node {\n"
              "    uint8_t *rgb;                /* RGB24, or packed YUV420P under yuv_output */\n"
              "    int has_pts;                 /* display-picture tag is valid */\n"
              "    uint64_t pts_us;             /* PTS belonging to this displayed picture */\n"
              "    struct mpeg2_frame_node *next;\n"
              "} mpeg2_frame_node;"
          )

          changed |= rep(
              "player/core/mr_mpeg2.c",
              "    if (!node) return MR_ENOMEM;\n"
              "    st = s->yuv_output ? emit_yuv(dec, node->rgb)\n"
              "                       : emit_rgb(dec, node->rgb);",
              "    if (!node) return MR_ENOMEM;\n"
              "    node->has_pts = 0;\n"
              "    node->pts_us = 0;\n"
              "    st = s->yuv_output ? emit_yuv(dec, node->rgb)\n"
              "                       : emit_rgb(dec, node->rgb);"
          )

          changed |= rep(
              "player/core/mr_mpeg2.c",
              "    if (st != MR_OK) {\n"
              "        node->next = s->free_nodes;\n"
              "        s->free_nodes = node;\n"
              "        return st;\n"
              "    }\n"
              "    if (s->pending_tail) s->pending_tail->next = node;",
              "    if (st != MR_OK) {\n"
              "        node->next = s->free_nodes;\n"
              "        s->free_nodes = node;\n"
              "        return st;\n"
              "    }\n"
              "    /* mpeg2_tag_picture() follows the compressed picture through\n"
              "     * libmpeg2's I/P/B reordering. Capture the tag from the DISPLAY\n"
              "     * picture, not from whichever PES packet mrplay is draining. */\n"
              "    if (s->info->display_picture &&\n"
              "        (s->info->display_picture->flags & PIC_FLAG_TAGS)) {\n"
              "        node->has_pts = 1;\n"
              "        node->pts_us = ((uint64_t)s->info->display_picture->tag << 32) |\n"
              "                       (uint64_t)s->info->display_picture->tag2;\n"
              "    }\n"
              "    if (s->pending_tail) s->pending_tail->next = node;"
          )

          p = Path("player/core/mr_mpeg2.c")
          s = p.read_text()
          marker = "static mr_status mpeg2_decode_packet(mr_decoder *dec,\n"
          insert = '''/* Tag the next MPEG picture with the container PTS. libmpeg2 carries this\n * through decode reordering and exposes it again on display_picture. */\nvoid mr_mpeg2_set_input_pts(mr_decoder *dec, int has_pts, uint64_t pts_us)\n{\n    mpeg2_state *s;\n    if (!dec || dec->codec != &mr_codec_mpeg2 || !has_pts) return;\n    s = (mpeg2_state *)dec->priv;\n    if (!s || !s->decoder) return;\n    mpeg2_tag_picture(s->decoder, (uint32_t)(pts_us >> 32),\n                      (uint32_t)(pts_us & 0xffffffffu));\n}\n\n/* Return the timestamp attached to the picture currently exposed in dec->frame. */\nint mr_mpeg2_output_pts(mr_decoder *dec, uint64_t *pts_us)\n{\n    mpeg2_state *s;\n    if (!dec || dec->codec != &mr_codec_mpeg2 || !pts_us) return 0;\n    s = (mpeg2_state *)dec->priv;\n    if (!s || !s->current || !s->current->has_pts) return 0;\n    *pts_us = s->current->pts_us;\n    return 1;\n}\n\n'''
          if "void mr_mpeg2_set_input_pts(" not in s:
              if s.count(marker) != 1:
                  raise SystemExit("mr_mpeg2.c: decode marker missing")
              p.write_text(s.replace(marker, insert + marker))
              changed = True

          changed |= rep(
              "player/core/mr_mpeg2.h",
              "void mr_mpeg2_set_yuv_output(mr_decoder *dec, int enabled);\n\n#endif /* MR_MPEG2_H */",
              "void mr_mpeg2_set_yuv_output(mr_decoder *dec, int enabled);\n\n"
              "/* Preserve PES timestamps across libmpeg2 display reordering. */\n"
              "void mr_mpeg2_set_input_pts(mr_decoder *dec, int has_pts, uint64_t pts_us);\n"
              "int mr_mpeg2_output_pts(mr_decoder *dec, uint64_t *pts_us);\n\n"
              "#endif /* MR_MPEG2_H */"
          )

          # Two decode sites: live catch-up and the normal playback loop.
          p = Path("player/amiga/mrplay.c")
          s = p.read_text()
          old = "                    mr_h264_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n                    mr_h264_set_input_annexb(&dec, pkt.is_annexb);"
          new = "                    mr_h264_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n                    mr_mpeg2_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n                    mr_h264_set_input_annexb(&dec, pkt.is_annexb);"
          if "mr_mpeg2_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);" not in s:
              n = s.count(old)
              if n != 2:
                  raise SystemExit(f"mrplay.c: expected 2 input-PTS sites, found {n}")
              s = s.replace(old, new)
              changed = True
          old = "                        if (codec == &mr_codec_h264)\n                            frame_has_pts = mr_h264_output_pts(\n                                &dec, &frame_pts_us);"
          new = "                        if (codec == &mr_codec_h264)\n                            frame_has_pts = mr_h264_output_pts(\n                                &dec, &frame_pts_us);\n                        else if (codec == &mr_codec_mpeg2)\n                            frame_has_pts = mr_mpeg2_output_pts(\n                                &dec, &frame_pts_us);"
          if "else if (codec == &mr_codec_mpeg2)\n                            frame_has_pts = mr_mpeg2_output_pts" not in s:
              if s.count(old) != 1:
                  raise SystemExit("mrplay.c: MPEG output-PTS insertion point missing")
              s = s.replace(old, new)
              changed = True
          p.write_text(s)

          # Existing MPEG fixture now proves displayed PTS tags are monotonic.
          p = Path("player/tests/mr_mpeg2_yuv_check.c")
          s = p.read_text()
          helper_marker = "/* Decode every displayed picture, appending each to `out` as RGB24. In YUV\n"
          helper = '''static int check_display_pts(mr_decoder *dec, int frame,\n                             uint64_t *last_pts, int *have_last, int *count)\n{\n    uint64_t pts;\n    if (!mr_mpeg2_output_pts(dec, &pts)) return 1;\n    if (*have_last && pts <= *last_pts) {\n        fprintf(stderr,\n                "FAIL: MPEG display PTS not increasing at frame %d: %llu after %llu\\n",\n                frame, (unsigned long long)pts,\n                (unsigned long long)*last_pts);\n        return 0;\n    }\n    *last_pts = pts;\n    *have_last = 1;\n    (*count)++;\n    return 1;\n}\n\n'''
          if "static int check_display_pts(" not in s:
              if s.count(helper_marker) != 1:
                  raise SystemExit("mpeg2 test: helper insertion point missing")
              s = s.replace(helper_marker, helper + helper_marker)
              changed = True
          if "int have_last_pts = 0, tagged_frames = 0;" not in s:
              old = "    size_t cap = 16, n = 0;\n    unsigned char *buf = (unsigned char *)malloc(cap * frame_bytes);"
              new = "    size_t cap = 16, n = 0;\n    uint64_t last_pts = 0;\n    int have_last_pts = 0, tagged_frames = 0;\n    unsigned char *buf = (unsigned char *)malloc(cap * frame_bytes);"
              if s.count(old) != 1: raise SystemExit("mpeg2 test: locals marker missing")
              s = s.replace(old, new)
              changed = True
          if "mr_mpeg2_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);" not in s:
              old = "        if (!pkt.is_video) continue;\n        st = mr_codec_mpeg2.decode(&dec, pkt.data, pkt.len);"
              new = "        if (!pkt.is_video) continue;\n        mr_mpeg2_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n        st = mr_codec_mpeg2.decode(&dec, pkt.data, pkt.len);"
              if s.count(old) != 1: raise SystemExit("mpeg2 test: feed marker missing")
              s = s.replace(old, new)
              changed = True
          normal_marker = "        for (got = (st == MR_OK); got; ) {\n            if (n == cap) {"
          normal_new = "        for (got = (st == MR_OK); got; ) {\n            if (!check_display_pts(&dec, (int)n, &last_pts, &have_last_pts,\n                                   &tagged_frames)) {\n                free(buf); mr_codec_mpeg2.close(&dec); return 0;\n            }\n            if (n == cap) {"
          if normal_new not in s:
              if s.count(normal_marker) != 1: raise SystemExit("mpeg2 test: normal loop marker missing")
              s = s.replace(normal_marker, normal_new)
              changed = True
          flush_marker = "    while (mr_codec_mpeg2.flush && mr_codec_mpeg2.flush(&dec) == MR_OK) {\n        if (n == cap) {"
          flush_new = "    while (mr_codec_mpeg2.flush && mr_codec_mpeg2.flush(&dec) == MR_OK) {\n        if (!check_display_pts(&dec, (int)n, &last_pts, &have_last_pts,\n                               &tagged_frames)) {\n            free(buf); mr_codec_mpeg2.close(&dec); return 0;\n        }\n        if (n == cap) {"
          if flush_new not in s:
              if s.count(flush_marker) != 1: raise SystemExit("mpeg2 test: flush loop marker missing")
              s = s.replace(flush_marker, flush_new)
              changed = True
          close_marker = "    mr_codec_mpeg2.close(&dec);\n    *out = buf;"
          close_new = "    if (tagged_frames < 2) {\n        fprintf(stderr, \"FAIL: only %d displayed MPEG frames carried PTS tags\\n\",\n                tagged_frames);\n        free(buf); mr_codec_mpeg2.close(&dec); return 0;\n    }\n    mr_codec_mpeg2.close(&dec);\n    *out = buf;"
          if close_new not in s:
              if s.count(close_marker) != 1: raise SystemExit("mpeg2 test: close marker missing")
              s = s.replace(close_marker, close_new)
              changed = True
          p.write_text(s)

          if not changed:
              Path("/tmp/nochanges").write_text("already applied")
          PY

      - name: Validate and push fix
        run: |
          if [ -f /tmp/nochanges ]; then
            echo "MPEG display PTS fix already present"
            exit 0
          fi
          git diff --check
          git diff --stat
          git config user.name "Darren Banfi"
          git config user.email "33876110+boingball@users.noreply.github.com"
          git add player/core/mr_mpeg2.c player/core/mr_mpeg2.h player/amiga/mrplay.c player/tests/mr_mpeg2_yuv_check.c
          git commit -m "Fix MPEG display-frame PTS after libmpeg2 reordering"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  fused-68060:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install m68k/QEMU correctness toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-m68k-linux-gnu qemu-user

      - name: Bit-exact fused planar check on m68k
        working-directory: player
        run: |
          set -e
          m68k-linux-gnu-gcc -O2 -std=c99 -m68030 -static \
            -DMR_M68K_ASM=1 \
            -o /tmp/mr_yuv_planar_queue_check.m68k \
            tests/mr_yuv_planar_queue_check.c \
            core/mr_yuv_planar_queue.c \
            core/mr_yuv_dither.c core/mr_yuv_dither_planar_m68k.S \
            core/mr_yuv_dither_planar_direct_m68k.S \
            core/mr_c2p.c core/mr_c2p_m68k.S \
            core/mr_c2p_riva_native_m68k.S
          qemu-m68k /tmp/mr_yuv_planar_queue_check.m68k

      - name: Build experimental 68060 mrplay
        run: |
          docker run --rm -v "$PWD":/src -w /src/player \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_ROOT="$(dirname "$(dirname "$AMIGA_GCC")")"
              "$AMIGA_GCC" --version | head -1
              make -f Makefile.fused mrplay-fused \
                CPU=68060 \
                AMIGA_ROOT="$AMIGA_ROOT" \
                SSL=1 SSLCERTS=1
            '

      - name: Confirm fused player
        run: |
          ls -la player/mrplay
          file player/mrplay || true

      - name: Upload fused 68060 player
        uses: actions/upload-artifact@v4
        with:
          name: MintVID-Fused-68060
          path: player/mrplay
          if-no-files-found: error
          retention-days: 14
