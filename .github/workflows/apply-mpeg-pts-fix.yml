name: Apply MPEG display PTS fix

on:
  push:
    branches: ["claude/mpeg1-looping-sound-f8xk62"]
    paths:
      - ".github/workflows/apply-mpeg-pts-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch MPEG PTS plumbing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              got = s.count(old)
              if got != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {got}: {old[:80]!r}")
              p.write_text(s.replace(old, new))

          # libmpeg2 can emit more than one display picture from a PES input and
          # reorders B/P pictures internally.  Carry the PES PTS through
          # libmpeg2's own picture-tag mechanism so each displayed frame owns the
          # timestamp that belongs to that picture, rather than inheriting the
          # packet currently being drained by mrplay.
          replace_exact(
              "player/core/mr_mpeg2.c",
              "typedef struct mpeg2_frame_node {\n"
              "    uint8_t *rgb;                /* RGB24, or packed YUV420P under yuv_output */\n"
              "    struct mpeg2_frame_node *next;\n"
              "} mpeg2_frame_node;",
              "typedef struct mpeg2_frame_node {\n"
              "    uint8_t *rgb;                /* RGB24, or packed YUV420P under yuv_output */\n"
              "    int has_pts;                 /* libmpeg2 display-picture tag is valid */\n"
              "    uint64_t pts_us;             /* presentation timestamp for this picture */\n"
              "    struct mpeg2_frame_node *next;\n"
              "} mpeg2_frame_node;"
          )

          replace_exact(
              "player/core/mr_mpeg2.c",
              "    if (!node) return MR_ENOMEM;\n"
              "    st = s->yuv_output ? emit_yuv(dec, node->rgb)\n"
              "                       : emit_rgb(dec, node->rgb);",
              "    if (!node) return MR_ENOMEM;\n"
              "    node->has_pts = 0;\n"
              "    node->pts_us = 0;\n"
              "    st = s->yuv_output ? emit_yuv(dec, node->rgb)\n"
              "                       : emit_rgb(dec, node->rgb);"
          )

          replace_exact(
              "player/core/mr_mpeg2.c",
              "    if (st != MR_OK) {\n"
              "        node->next = s->free_nodes;\n"
              "        s->free_nodes = node;\n"
              "        return st;\n"
              "    }\n"
              "    if (s->pending_tail) s->pending_tail->next = node;",
              "    if (st != MR_OK) {\n"
              "        node->next = s->free_nodes;\n"
              "        s->free_nodes = node;\n"
              "        return st;\n"
              "    }\n"
              "    /* mpeg2_tag_picture() follows a compressed picture through\n"
              "     * libmpeg2's I/P/B decode reordering.  Read the tag from the\n"
              "     * DISPLAY picture here, when we copy that picture into an\n"
              "     * owned queue node, so draining a second picture from the same\n"
              "     * PES packet cannot accidentally reuse that packet's PTS. */\n"
              "    if (s->info->display_picture &&\n"
              "        (s->info->display_picture->flags & PIC_FLAG_TAGS)) {\n"
              "        node->has_pts = 1;\n"
              "        node->pts_us = ((uint64_t)s->info->display_picture->tag << 32) |\n"
              "                       (uint64_t)s->info->display_picture->tag2;\n"
              "    }\n"
              "    if (s->pending_tail) s->pending_tail->next = node;"
          )

          marker = "static mr_status mpeg2_decode_packet(mr_decoder *dec,\n"
          insert = r'''/* Attach a container PTS to the next MPEG picture header encountered by
 * libmpeg2.  This is libmpeg2's intended timestamp mechanism: the tag travels
 * with the picture through decode reordering and is exposed again on
 * info->display_picture.  A no-op for non-MPEG decoders and packets without a
 * timestamp. */
void mr_mpeg2_set_input_pts(mr_decoder *dec, int has_pts, uint64_t pts_us)
{
    mpeg2_state *s;
    if (!dec || dec->codec != &mr_codec_mpeg2 || !has_pts) return;
    s = (mpeg2_state *)dec->priv;
    if (!s || !s->decoder) return;
    mpeg2_tag_picture(s->decoder, (uint32_t)(pts_us >> 32),
                      (uint32_t)(pts_us & 0xffffffffu));
}

/* Return the PTS belonging to the picture currently exposed in dec->frame.
 * Crucially this is the displayed picture's libmpeg2 tag, not the PTS of the
 * compressed PES packet mrplay happened to feed most recently. */
int mr_mpeg2_output_pts(mr_decoder *dec, uint64_t *pts_us)
{
    mpeg2_state *s;
    if (!dec || dec->codec != &mr_codec_mpeg2 || !pts_us) return 0;
    s = (mpeg2_state *)dec->priv;
    if (!s || !s->current || !s->current->has_pts) return 0;
    *pts_us = s->current->pts_us;
    return 1;
}

'''
          p = Path("player/core/mr_mpeg2.c")
          s = p.read_text()
          if s.count(marker) != 1:
              raise SystemExit("mr_mpeg2.c: decode marker not unique")
          p.write_text(s.replace(marker, insert + marker))

          replace_exact(
              "player/core/mr_mpeg2.h",
              "void mr_mpeg2_set_yuv_output(mr_decoder *dec, int enabled);\n\n#endif /* MR_MPEG2_H */",
              "void mr_mpeg2_set_yuv_output(mr_decoder *dec, int enabled);\n\n"
              "/* Carry container timestamps through libmpeg2's own picture tags so\n"
              " * reordered/drained display pictures retain their real PTS. */\n"
              "void mr_mpeg2_set_input_pts(mr_decoder *dec, int has_pts, uint64_t pts_us);\n"
              "int mr_mpeg2_output_pts(mr_decoder *dec, uint64_t *pts_us);\n\n"
              "#endif /* MR_MPEG2_H */"
          )

          # mrplay already hands H.264 the packet PTS before every decode. Do the
          # same for MPEG-1/2; the helper is a no-op for every other decoder.
          replace_exact(
              "player/amiga/mrplay.c",
              "                    mr_h264_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n"
              "                    mr_h264_set_input_annexb(&dec, pkt.is_annexb);",
              "                    mr_h264_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n"
              "                    mr_mpeg2_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n"
              "                    mr_h264_set_input_annexb(&dec, pkt.is_annexb);",
              count=1
          )
          replace_exact(
              "player/amiga/mrplay.c",
              "                    mr_h264_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n"
              "                    mr_h264_set_input_annexb(&dec, pkt.is_annexb);\n"
              "                    a = monotonic_us();",
              "                    mr_h264_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n"
              "                    mr_mpeg2_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n"
              "                    mr_h264_set_input_annexb(&dec, pkt.is_annexb);\n"
              "                    a = monotonic_us();",
              count=1
          )

          replace_exact(
              "player/amiga/mrplay.c",
              "                        if (codec == &mr_codec_h264)\n"
              "                            frame_has_pts = mr_h264_output_pts(\n"
              "                                &dec, &frame_pts_us);",
              "                        if (codec == &mr_codec_h264)\n"
              "                            frame_has_pts = mr_h264_output_pts(\n"
              "                                &dec, &frame_pts_us);\n"
              "                        else if (codec == &mr_codec_mpeg2)\n"
              "                            frame_has_pts = mr_mpeg2_output_pts(\n"
              "                                &dec, &frame_pts_us);"
          )

          # Exercise the real PS->libmpeg2 timestamp path in the existing fixture
          # test.  The display-picture PTS values must increase in display order;
          # duplicate packet timestamps on drained pictures are the regression.
          replace_exact(
              "player/tests/mr_mpeg2_yuv_check.c",
              "    size_t cap = 16, n = 0;\n"
              "    unsigned char *buf = (unsigned char *)malloc(cap * frame_bytes);",
              "    size_t cap = 16, n = 0;\n"
              "    uint64_t last_pts = 0;\n"
              "    int have_last_pts = 0, tagged_frames = 0;\n"
              "    unsigned char *buf = (unsigned char *)malloc(cap * frame_bytes);"
          )
          replace_exact(
              "player/tests/mr_mpeg2_yuv_check.c",
              "        if (!pkt.is_video) continue;\n"
              "        st = mr_codec_mpeg2.decode(&dec, pkt.data, pkt.len);",
              "        if (!pkt.is_video) continue;\n"
              "        mr_mpeg2_set_input_pts(&dec, pkt.has_pts, pkt.pts_us);\n"
              "        st = mr_codec_mpeg2.decode(&dec, pkt.data, pkt.len);"
          )

          # Insert the same check before both frame-copy sites (normal drain and
          # EOF flush).  Using a small local block keeps C99 declarations scoped.
          check = r'''            {
                uint64_t out_pts;
                if (mr_mpeg2_output_pts(&dec, &out_pts)) {
                    if (have_last_pts && out_pts <= last_pts) {
                        fprintf(stderr,
                                "FAIL: MPEG display PTS not increasing at frame %d: %llu after %llu\n",
                                (int)n, (unsigned long long)out_pts,
                                (unsigned long long)last_pts);
                        free(buf); mr_codec_mpeg2.close(&dec); return 0;
                    }
                    last_pts = out_pts;
                    have_last_pts = 1;
                    tagged_frames++;
                }
            }
'''
          p = Path("player/tests/mr_mpeg2_yuv_check.c")
          s = p.read_text()
          needle1 = "        for (got = (st == MR_OK); got; ) {\n            if (n == cap) {"
          if s.count(needle1) != 1:
              raise SystemExit("mpeg2 test: normal output loop marker missing")
          s = s.replace(needle1,
                        "        for (got = (st == MR_OK); got; ) {\n" + check +
                        "            if (n == cap) {")
          needle2 = "    while (mr_codec_mpeg2.flush && mr_codec_mpeg2.flush(&dec) == MR_OK) {\n        if (n == cap) {"
          if s.count(needle2) != 1:
              raise SystemExit("mpeg2 test: flush output marker missing")
          flushcheck = check.replace("            {", "        {").replace("                ", "            ").replace("            }\n", "        }\n")
          # Keep indentation cosmetic; semantics are identical.
          s = s.replace(needle2,
                        "    while (mr_codec_mpeg2.flush && mr_codec_mpeg2.flush(&dec) == MR_OK) {\n" +
                        flushcheck + "        if (n == cap) {")
          endneedle = "    mr_codec_mpeg2.close(&dec);\n    *out = buf;"
          if s.count(endneedle) != 1:
              raise SystemExit("mpeg2 test: close marker missing")
          s = s.replace(endneedle,
                        "    if (tagged_frames < 2) {\n"
                        "        fprintf(stderr, \"FAIL: only %d displayed MPEG frames carried PTS tags\\n\", tagged_frames);\n"
                        "        free(buf); mr_codec_mpeg2.close(&dec); return 0;\n"
                        "    }\n"
                        "    mr_codec_mpeg2.close(&dec);\n"
                        "    *out = buf;")
          p.write_text(s)
          PY

      - name: Show diff
        run: git diff --check && git diff --stat && git diff

      - name: Commit fix
        run: |
          git config user.name "Darren Banfi"
          git config user.email "33876110+boingball@users.noreply.github.com"
          git add player/core/mr_mpeg2.c player/core/mr_mpeg2.h player/amiga/mrplay.c player/tests/mr_mpeg2_yuv_check.c
          git commit -m "Fix MPEG display-frame PTS after libmpeg2 reordering"
          git push origin HEAD:${{ github.ref_name }}
